<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; background: #f4f6f5; margin: 0; padding: 24px; color: #2c2c2c; }
    .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 560px; margin: 0 auto 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.lead { color: #666; margin-top: 0; }
    .profile-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .profile-row:last-child { border-bottom: none; }
    .profile-row .label { color: #777; }
    .profile-row .value { font-weight: 600; }
    .type-badge { display: inline-block; background: #e5f4ec; color: #256a4a; padding: 4px 12px; border-radius: 999px; font-weight: 600; }
    .stars { font-size: 24px; letter-spacing: 4px; cursor: pointer; }
    .stars span { color: #ddd; }
    .stars span.active { color: #f0a72e; }
    textarea { width: 100%; box-sizing: border-box; min-height: 80px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; font-family: inherit; }
    button { margin-top: 16px; background: #3f7d63; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status, #reflectStatus { margin-top: 12px; padding: 12px; border-radius: 8px; display: none; white-space: pre-wrap; }
    #status.ok, #reflectStatus.ok { display: block; background: #e5f4ec; color: #256a4a; }
    #status.err, #reflectStatus.err { display: block; background: #fbe7e7; color: #a33; }
  </style>
</head>
<body>
  <div class="card">
    <h1>マイ・プロファイル</h1>
    <p class="lead">あなた自身の学びの特性です。他の人のデータは表示されません。</p>
    <div id="profile">読み込み中...</div>
    <div id="status"></div>
  </div>

  <div class="card">
    <h1>今日の振り返り</h1>
    <p class="lead">学習が終わったら1分で入力しましょう。</p>
    <div>集中度</div>
    <div class="stars" id="stars">
      <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
    </div>
    <div>工夫した点</div>
    <textarea id="message" placeholder="今日の学習で工夫したこと・気づいたことを書いてみましょう"></textarea>
    <button id="submitBtn" onclick="submitReflection()">送信する</button>
    <div id="reflectStatus"></div>
  </div>

  <script>
    var selectedConcentration = 0;

    function initStars() {
      var stars = document.querySelectorAll('#stars span');
      stars.forEach(function (star) {
        star.addEventListener('click', function () {
          selectedConcentration = Number(star.getAttribute('data-value'));
          stars.forEach(function (s) {
            s.classList.toggle('active', Number(s.getAttribute('data-value')) <= selectedConcentration);
          });
        });
      });
    }

    function renderProfile(result) {
      var el = document.getElementById('profile');
      if (!result.found) {
        el.innerHTML = '<p>まだあなたのデータは登録されていません。管理者にお問い合わせください。（' + result.email + '）</p>';
        return;
      }
      var d = result.data;
      el.innerHTML =
        '<div class="profile-row"><span class="label">氏名</span><span class="value">' + escapeHtml(d['氏名']) + '</span></div>' +
        '<div class="profile-row"><span class="label">クラス</span><span class="value">' + escapeHtml(d['クラス']) + '</span></div>' +
        '<div class="profile-row"><span class="label">学びタイプ</span><span class="value"><span class="type-badge">' + escapeHtml(d['タイプ判定']) + '</span></span></div>' +
        '<div class="profile-row"><span class="label">非認知スコア（自己効力感）</span><span class="value">' + escapeHtml(d['自己効力感']) + '</span></div>' +
        '<div class="profile-row"><span class="label">今週の学習時間</span><span class="value">' + escapeHtml(d['学習時間']) + ' 分</span></div>';
    }

    function escapeHtml(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function loadProfile() {
      google.script.run
        .withSuccessHandler(renderProfile)
        .withFailureHandler(function (err) {
          var el = document.getElementById('status');
          el.textContent = 'エラー: ' + (err && err.message ? err.message : err);
          el.className = 'err';
        })
        .getStudentData();
    }

    function submitReflection() {
      var btn = document.getElementById('submitBtn');
      var statusEl = document.getElementById('reflectStatus');
      var message = document.getElementById('message').value;

      if (!selectedConcentration) {
        statusEl.textContent = '集中度を選択してください。';
        statusEl.className = 'err';
        return;
      }

      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function () {
          statusEl.textContent = '振り返りを送信しました！お疲れさまでした。';
          statusEl.className = 'ok';
          btn.disabled = false;
          document.getElementById('message').value = '';
        })
        .withFailureHandler(function (err) {
          statusEl.textContent = 'エラー: ' + (err && err.message ? err.message : err);
          statusEl.className = 'err';
          btn.disabled = false;
        })
        .submitReflection({ concentration: selectedConcentration, message: message });
    }

    initStars();
    loadProfile();
  </script>
</body>
</html>
