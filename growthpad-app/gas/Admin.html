<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; background: #f4f6f5; margin: 0; padding: 24px; color: #2c2c2c; }
    .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 640px; margin: 0 auto 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.lead { color: #666; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input[type=file] { width: 100%; box-sizing: border-box; }
    button { margin-top: 20px; background: #3f7d63; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; white-space: pre-wrap; }
    #status.ok { display: block; background: #e5f4ec; color: #256a4a; }
    #status.err { display: block; background: #fbe7e7; color: #a33; }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
    th { color: #777; font-weight: 600; }
    .type-badge { display: inline-block; background: #e5f4ec; color: #256a4a; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; white-space: nowrap; }
    .empty { color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GrowthPad 管理者画面</h1>
    <p class="lead">Ai GROW / スタディサプリ の CSV を選択し、1クリックでデータベースを更新します。</p>

    <label for="aigrowFile">Ai GROW 評価結果 CSV</label>
    <input type="file" id="aigrowFile" accept=".csv">
    <div class="hint">UTF-8 / Shift_JIS(CP932) のどちらの文字コードでもブラウザ側で自動判定して読み込みます。</div>

    <label for="studysapuriFile">スタディサプリ 学習ログ CSV</label>
    <input type="file" id="studysapuriFile" accept=".csv">
    <div class="hint">列の並び順が変わっても、ヘッダー名で自動的に検索します。</div>

    <button id="updateBtn" onclick="runUpdate()">データ更新実行</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h1>DB_統合データ（プレビュー）</h1>
    <p class="lead">名寄せ済みマスターデータ。ここに表示されない生徒がいる場合は、CSVの列名が一致していない可能性があります。</p>
    <div id="preview"><p class="empty">まだデータがありません。上でCSVを取り込んでください。</p></div>
  </div>

  <script>
    function renderPreview(preview) {
      var el = document.getElementById('preview');
      if (!preview || !preview.rows || preview.rows.length === 0) {
        el.innerHTML = '<p class="empty">DB_統合データ は空です。CSVのヘッダー名がAi GROW/スタディサプリの実際の列名と一致しているかご確認ください。</p>';
        return;
      }
      var rowsHtml = preview.rows.map(function (row) {
        var strengths = row['強み'] || [];
        var strengthBadges = strengths.length > 0
          ? strengths.map(function (s) { return '<span class="type-badge">' + escapeHtml(s.competency) + '</span>'; }).join(' ')
          : '<span class="empty">-</span>';
        return '<tr>' +
          '<td>' + escapeHtml(row['氏名']) + '</td>' +
          '<td>' + escapeHtml(row['クラス']) + '</td>' +
          '<td>' + escapeHtml(row['学習時間(分)']) + '</td>' +
          '<td>' + escapeHtml(row['講義完了数']) + '</td>' +
          '<td>' + strengthBadges + '</td>' +
          '</tr>';
      }).join('');
      el.innerHTML = '<p>現在 ' + preview.rows.length + ' 名分のデータが統合されています。</p>' +
        '<table><thead><tr><th>氏名</th><th>クラス</th><th>学習時間(分)</th><th>講義完了数</th><th>強み（特に高いコンピテンシー）</th></tr></thead>' +
        '<tbody>' + rowsHtml + '</tbody></table>';
    }

    function escapeHtml(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // ページ読み込み時と更新後の2回 loadPreview() が呼ばれる可能性があり、
    // サーバー往復のタイミング次第では古いレスポンスが後から返ってきて
    // 新しい表示を上書きしてしまうことがある。リクエストIDで最新のものだけ反映する。
    var previewRequestId = 0;
    function loadPreview() {
      var requestId = ++previewRequestId;
      google.script.run
        .withSuccessHandler(function (preview) {
          if (requestId !== previewRequestId) return; // 古いレスポンスは無視
          renderPreview(preview);
        })
        .withFailureHandler(function (err) {
          console.error(err);
        })
        .getIntegratedPreview();
    }
    // CSVの文字コードはエクスポート元によって UTF-8 / Shift_JIS のどちらもあり得るため、
    // まず UTF-8 として厳密デコードを試み、失敗したら Shift_JIS にフォールバックする。
    function readAsTextAutoDetect(file) {
      return new Promise(function (resolve, reject) {
        if (!file) { resolve(null); return; }
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var bytes = new Uint8Array(reader.result);
            // UTF-8 BOM (EF BB BF) が付いている場合はそれを取り除いて UTF-8 で読む
            if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
              resolve(new TextDecoder('utf-8').decode(bytes.subarray(3)));
              return;
            }
            try {
              resolve(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
            } catch (utf8Error) {
              resolve(new TextDecoder('shift_jis').decode(bytes));
            }
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = function () { reject(reader.error); };
        reader.readAsArrayBuffer(file);
      });
    }

    function showStatus(message, isError) {
      var el = document.getElementById('status');
      el.textContent = message;
      el.className = isError ? 'err' : 'ok';
    }

    function callServer(type, csvText) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .processCsvUpload(type, csvText);
      });
    }

    async function runUpdate() {
      var btn = document.getElementById('updateBtn');
      var aigrowFile = document.getElementById('aigrowFile').files[0];
      var studysapuriFile = document.getElementById('studysapuriFile').files[0];

      if (!aigrowFile && !studysapuriFile) {
        showStatus('少なくとも1つのCSVファイルを選択してください。', true);
        return;
      }

      btn.disabled = true;
      showStatus('データ更新中...', false);

      try {
        var results = [];
        if (aigrowFile) {
          var aigrowText = await readAsTextAutoDetect(aigrowFile);
          results.push(await callServer('AiGROW', aigrowText));
        }
        if (studysapuriFile) {
          var studyText = await readAsTextAutoDetect(studysapuriFile);
          results.push(await callServer('StudySapuri', studyText));
        }
        var summary = results.map(function (r) { return r.message; }).join('\n');
        showStatus('更新完了！\n' + summary, false);
        loadPreview();
      } catch (err) {
        showStatus('エラー: ' + (err && err.message ? err.message : err), true);
      } finally {
        btn.disabled = false;
      }
    }

    loadPreview();
  </script>
</body>
</html>
