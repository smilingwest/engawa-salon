<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; background: #f4f6f5; margin: 0; padding: 24px; color: #2c2c2c; }
    .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 640px; margin: 0 auto 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.lead { color: #666; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input[type=file] { width: 100%; box-sizing: border-box; }
    button { margin-top: 20px; background: #3f7d63; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; white-space: pre-wrap; }
    #status.ok { display: block; background: #e5f4ec; color: #256a4a; }
    #status.err { display: block; background: #fbe7e7; color: #a33; }
    .hint { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>GrowthPad 管理者画面</h1>
    <p class="lead">Ai GROW / スタディサプリ の CSV を選択し、1クリックでデータベースを更新します。</p>

    <label for="aigrowFile">Ai GROW 評価結果 CSV</label>
    <input type="file" id="aigrowFile" accept=".csv">
    <div class="hint">Shift_JIS(CP932) 形式のCSVでもブラウザ側で自動変換します。</div>

    <label for="studysapuriFile">スタディサプリ 学習ログ CSV</label>
    <input type="file" id="studysapuriFile" accept=".csv">
    <div class="hint">列の並び順が変わっても、ヘッダー名で自動的に検索します。</div>

    <button id="updateBtn" onclick="runUpdate()">データ更新実行</button>
    <div id="status"></div>
  </div>

  <script>
    function readAsShiftJisText(file) {
      return new Promise(function (resolve, reject) {
        if (!file) { resolve(null); return; }
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var decoder = new TextDecoder('shift_jis');
            resolve(decoder.decode(new Uint8Array(reader.result)));
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = function () { reject(reader.error); };
        reader.readAsArrayBuffer(file);
      });
    }

    function showStatus(message, isError) {
      var el = document.getElementById('status');
      el.textContent = message;
      el.className = isError ? 'err' : 'ok';
    }

    function callServer(type, csvText) {
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .processCsvUpload(type, csvText);
      });
    }

    async function runUpdate() {
      var btn = document.getElementById('updateBtn');
      var aigrowFile = document.getElementById('aigrowFile').files[0];
      var studysapuriFile = document.getElementById('studysapuriFile').files[0];

      if (!aigrowFile && !studysapuriFile) {
        showStatus('少なくとも1つのCSVファイルを選択してください。', true);
        return;
      }

      btn.disabled = true;
      showStatus('データ更新中...', false);

      try {
        var results = [];
        if (aigrowFile) {
          var aigrowText = await readAsShiftJisText(aigrowFile);
          results.push(await callServer('AiGROW', aigrowText));
        }
        if (studysapuriFile) {
          var studyText = await readAsShiftJisText(studysapuriFile);
          results.push(await callServer('StudySapuri', studyText));
        }
        var summary = results.map(function (r) { return r.message; }).join('\n');
        showStatus('更新完了！\n' + summary, false);
      } catch (err) {
        showStatus('エラー: ' + (err && err.message ? err.message : err), true);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
